<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Voting System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
.header {
  width: 100%;
  margin: 20px auto;
}

.afpi-hero {
  position: relative;
  width: 100%;
  height: 260px;
  border-radius: 14px;
  overflow: hidden;

  /*
   * Collage background.
   * Nanti bisa diganti dengan satu gambar collage AFPI
   * yang kita siapkan khusus.
   */
  background:
    linear-gradient(
      120deg,
      rgba(11, 39, 21, 0.82),
      rgba(24, 97, 58, 0.72),
      rgba(130, 170, 90, 0.30),
      rgba(245, 236, 195, 0.18)
    ),
    url("https://picsum.photos/seed/afpi-musyawarah-2026/1400/500");

  background-size: cover;
  background-position: center;

  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

.afpi-hero-overlay {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      135deg,
      rgba(8, 30, 18, 0.86),
      rgba(29, 75, 42, 0.50),
      rgba(175, 190, 120, 0.18),
      rgba(255, 255, 255, 0.08)
    );

  z-index: 1;
}

.afpi-hero-logo {
  position: absolute;

  top: 22px;
  right: 25px;

  width: 135px;
  max-width: 30%;

  z-index: 2;

  filter:
    drop-shadow(0 4px 10px rgba(255,255,255,0.32));
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 6px;
}

.afpi-hero-title {
  position: absolute;

  left: 35px;
  bottom: 30px;

  z-index: 2;

  color: #b9c97c;

  text-shadow:
    0 2px 8px rgba(0,0,0,0.55);
}

.afpi-hero-main {
  font-size: clamp(24px, 4vw, 40px);
  font-weight: 800;
  letter-spacing: 1px;
  color: #cddd8a;
}

.afpi-hero-year {
  margin-top: 3px;

  font-size: clamp(20px, 3vw, 30px);
  font-weight: 600;
  letter-spacing: 4px;
  color: #dfeab3;
}

@media (max-width: 600px) {

  .afpi-hero {
    height: 210px;
  }

  .afpi-hero-logo {
    width: 100px;
    top: 15px;
    right: 15px;
  }

  .afpi-hero-title {
    left: 20px;
    bottom: 20px;
  }

}

.subtitle {
  margin: 0;
  font-size: 14px;
  color: #555;
}
    body {
      font-family: 'Inter', sans-serif;
      background: #f6f8fa;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 20px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 20px;
    }
    input, button, select, textarea {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #1d4ed8; }
    .section {
      margin-top: 30px;
    }
    .option-input {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .option-input input { flex: 1; }
    canvas { margin-top: 20px; max-width:100%; }
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45); /* semi transparan gelap */
      z-index: 999;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #2563eb;
      font-weight: 500;
      flex-direction: column;
      backdrop-filter: blur(1px); /* efek modern */
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.25);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }
    #loadingOverlayText {
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .vote-card {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 16px;

      min-height: 220px;

      border: 2px solid #ddd;
      border-radius: 14px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;

      background: #fff;

      box-sizing: border-box;
    }

    .vote-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 6px 18px rgba(0,0,0,0.12);
    }

    .vote-card.selected {
      transform: translateY(-4px) scale(1.02);

      box-shadow:
        0 0 0 3px rgba(37,99,235,0.12),
        0 8px 20px rgba(0,0,0,0.15);
    }

    #voteOptions {
      display: grid;

      grid-template-columns: repeat(
        auto-fit,
        minmax(190px, 1fr)
      );

      gap: 16px;

      margin-top: 15px;
    }

    .vote-card img {
      width: 100%;
      height: 130px;

      border-radius: 10px;

      object-fit: cover;

      display: block;

      margin-bottom: 12px;

      background: #f1f5f9;
    }

    .vote-option-label {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }

    .vote-card .option-description {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 6px;
    }

    .vote-radio {
      display: none; /* sembunyikan radio asli */
    }

    /* shimmer skeleton */
    .shimmer {
      background: linear-gradient(90deg, #e6e6e6 0%, #f5f5f5 50%, #e6e6e6 100%);
      background-size: 200% 100%;
      border-radius: 10px;
      height: 76px;
      margin: 10px 0;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -150% 0; }
      100% { background-position: 150% 0; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- single loading overlay -->
  <div id="loadingOverlay" role="status" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
    <div id="loadingOverlayText">Loading...</div>
  </div>

  <div class="header">
    <div class="afpi-hero">

      <div class="afpi-hero-overlay"></div>

      <img
        src="https://afpi.or.id/assets/images/AFPI%20Final%20Logo%20with%20Abbreviation.png"
        alt="AFPI Logo"
        class="afpi-hero-logo"
      />

      <div class="afpi-hero-title">
        <div class="afpi-hero-main">
          MUSYAWARAH AFPI IV
        </div>

        <div class="afpi-hero-year">
          2026
        </div>
      </div>

    </div>
  </div>

  <div class="container">
    <!-- ADMIN SECTION -->
    <div id="adminSection" class="section" style="display:none;">
      <h2>Create Voting Context</h2>
      <form id="createContextForm">
        <input id="contextTitle" placeholder="Enter vote title..." required />
        <div id="optionsContainer">
          <div class="option-input">
            <input placeholder="Option 1" required />
          </div>
        </div>
        <button type="button" id="addOption">+ Add Option</button>
        <button type="submit">Create Context</button>
      </form>
    </div>

    <!-- VOTER SECTION -->
    <div id="voterSection" class="section">
      <h2>Cast Your Vote</h2>
      <select id="contextSelect"></select>
      <div id="voteOptions"></div>
      <input id="tokenInput" placeholder="Enter your unique token" />
      <button id="submitVote">Submit Vote</button>
    </div>

    <!-- RESULTS -->
    <div class="section">
      <h2>Results</h2>
      <button id="refreshResults">Refresh Results</button>
      <canvas id="resultsChart" width="400" height="200"></canvas>
    </div>
  </div>

  <script>
    const optionColorMap = {};
    const OPTION_COLORS = [
    "#2563eb", // blue
    "#16a34a", // green
    "#dc2626", // red
    "#7c3aed", // purple
    "#ea580c", // orange
    "#0891b2", // cyan
    "#ca8a04", // yellow
    "#be185d"  // pink
    ];

    function getColorByIndex(index) {
      return OPTION_COLORS[index % OPTION_COLORS.length];
    }
    const API_URL = "https://script.google.com/macros/s/AKfycbx3x9x5CgsZJs2ppyv9ngxKbBpTu6O9ZbEy8LY2Wa7n18B8cj7UzZs-jqYXCoYII7--IA/exec";
    const isAdmin = window.location.search.includes("admin=1");
    document.getElementById("adminSection").style.display = isAdmin ? "block" : "none";

    let lastVoteRowSaved = null;
    let pendingVoteId = null;
    let chart;

    const ctxSelect = document.getElementById("contextSelect");
    const voteOptionsDiv = document.getElementById("voteOptions");

    function showLoading(show = true, text = "Loading...") {
      const overlay = document.getElementById("loadingOverlay");
      if (!overlay) return;
      overlay.style.display = show ? "flex" : "none";
      document.getElementById("loadingOverlayText").textContent = text;
    }

    async function apiPost(data = {}) {
      const formData = new FormData();
      for (const key in data) {
        formData.append(key, data[key]);
      }

      const res = await fetch(API_URL, {
        method: "POST",
        body: formData,
      });

      return res.json();
    }

    async function apiGet(params = "") {
      const res = await fetch(`${API_URL}?${params}`, { cache: "no-store" });
      return res.json();
    }

    // ---- Load contexts ----
    async function loadContexts() {
      showLoading(true, "Loading contexts...");
      try {
        const json = await apiGet("action=getContexts");
        ctxSelect.innerHTML = "";
        if (!json.success || !json.contexts?.length) {
          ctxSelect.innerHTML = `<option value="">No context available</option>`;
          voteOptionsDiv.innerHTML = `<div class="shimmer"></div>`;
          showLoading(false);
          return;
        }
        json.contexts.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.title;
          ctxSelect.appendChild(opt);
        });
        // select first by default
        if (ctxSelect.options.length > 0) ctxSelect.selectedIndex = 0;
        // render the first context
        await renderOptions(); // no param required
        await loadResults();
      } catch (err) {
        console.error("loadContexts error", err);
      } finally {
        showLoading(false);
      }
    }

    // ---- Render options (accept optional ctxArg or use select) ----
    async function renderOptions(ctxArg) {
      showLoading(true, "Loading options...");
      // shimmer
      voteOptionsDiv.innerHTML = `<div class="shimmer"></div><div class="shimmer"></div><div class="shimmer"></div>`;

      try {
        let ctx = ctxArg;
        if (!ctx) {
          // get selected id and fetch contexts
          const selectedId = ctxSelect.value;
          if (!selectedId) {
            voteOptionsDiv.innerHTML = '';
            showLoading(false);
            return;
          }
          const json = await apiGet("action=getContexts");
          ctx = json.contexts?.find(c => c.id === selectedId);
        }

        if (!ctx) {
          voteOptionsDiv.innerHTML = '';
          showLoading(false);
          return;
        }

        // parse options
        let options = ctx.options;
        if (typeof options === "string") {
          try {
            options = JSON.parse(options);
          } catch (e) {
            console.error("Failed to parse options:", e);
            options = [];
          }
        }
        voteOptionsDiv.innerHTML = "";

        options.forEach((opt, idx) => {
          let name = "";
          let img = "";
          let desc = "";

          if (typeof opt === "object" && opt !== null) {
            name = opt.name || opt.title || "Option";
            desc = opt.desc || "";
            if (opt.img) {
              img = opt.img;
            }
          } else {
            name = String(opt);
          }
          const color = getColorByIndex(idx);
          optionColorMap[name] = color;
          if (!img) {
            const imageSeed = encodeURIComponent(
              `afpi-${name.toLowerCase().replace(/\s+/g, "-")}`
            );

            img = `https://picsum.photos/seed/${imageSeed}/500/320`;
          }

          const safeId = String(name).replace(/\s+/g, "_").replace(/[^\w\-]/g, "");
          const div = document.createElement("div");
          div.className = "vote-card";

          div.innerHTML = `
            <input type="radio" class="vote-radio" id="opt_${safeId}" name="voteOption" value="${escapeHtml(name)}">
            <img src="${img}" alt="img" onerror="this.src='https://i.ibb.co/4pQ5Cz5/placeholder.jpg'">
            <div class="option-content">
              <div class="vote-option-label">${escapeHtml(name)}</div>
              ${desc ? `<div class="option-description">${escapeHtml(desc)}</div>` : ''}
            </div>
          `;

          // click selects radio and highlights card
          div.onclick = () => {
            const el = document.getElementById(`opt_${safeId}`);
            if (el) el.checked = true;
            document.querySelectorAll(".vote-card").forEach(c => {
              c.classList.remove("selected");
              c.style.borderColor = "#ddd";
            });
            div.classList.add("selected");
            div.style.borderColor = color;

          };

          voteOptionsDiv.appendChild(div);
        });

      } catch (err) {
        console.error("renderOptions error", err);
        voteOptionsDiv.innerHTML = `<div class="shimmer"></div>`;
      } finally {
        showLoading(false);
      }
    }

    // simple HTML escaping to avoid broken attributes
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // ---- Create context (Admin only) ----
    if (isAdmin) {
      document.getElementById("addOption").onclick = () => {
        const div = document.createElement("div");
        div.classList.add("option-input");
        div.innerHTML = `<input placeholder="New Option" required />`;
        document.getElementById("optionsContainer").appendChild(div);
      };

      document.getElementById("createContextForm").onsubmit = async (e) => {
        e.preventDefault();
        const title = document.getElementById("contextTitle").value.trim();
        const options = Array.from(document.querySelectorAll("#optionsContainer input"))
          .map(i => i.value.trim()).filter(Boolean);
        showLoading(true, "Creating context...");
        try {
          const res = await apiPost({ action: "createContext", title, options: JSON.stringify(options) });
          alert(res.message || "Context created!");
          await loadContexts();
        } catch (err) {
          console.error("create context error", err);
          alert("Failed to create context");
        } finally {
          showLoading(false);
        }
      };
    }

    // ---- Submit vote ----
    document.getElementById("submitVote").onclick = async () => {
      showLoading(true, "Processing vote...");
      try {
        const contextId = ctxSelect.value;
        const choice = document.querySelector("input[name='voteOption']:checked")?.value;
        const token = document.getElementById("tokenInput").value.trim();
        if (!contextId || !choice || !token) {
          showLoading(false);
          alert("Please select context, option, and enter token!");
          return;
        }

        const fingerprint = navigator.userAgent;
        const res = await apiPost({
          action: "submitVote",
          contextId,
          choice,
          token,
          fingerprint
        });

        if (!res.success) {
          showLoading(false);
          alert(res.message || "Vote failed!");
          return;
        }

        alert("Vote recorded successfully!");
        await loadResults(); // menunggu sampai chart update
      } catch (err) {
        console.error("Vote error:", err);
        alert("Unexpected error submitting vote!");
      } finally {
        showLoading(false);
      }
    };

    // ---- Load results ----
    async function loadResults() {
      const contextId = ctxSelect.value;
      if (!contextId) return;
      showLoading(true, "Loading results...");
      try {
        const json = await apiGet(`action=getResults&contextId=${contextId}`);
        if (!json.success) {
          console.warn("Error getResults", json);
          showLoading(false);
          return;
        }

        const labels = Object.keys(json.results);
        const data = Object.values(json.results);

        if (chart) chart.destroy();
        chart = new Chart(document.getElementById("resultsChart"), {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "Votes",
              data,
              backgroundColor: "rgba(37,99,235,0.7)"
            }]
          },
          options: { scales: { y: { beginAtZero: true } }, plugins:{legend:{display:false}} }
        });

      } catch (err) {
        console.error("loadResults error", err);
      } finally {
        showLoading(false);
      }
    }

    document.getElementById("refreshResults").onclick = loadResults;

    // when select changes -> renderOptions + refresh results
    ctxSelect.onchange = async () => {
      await renderOptions(); // now renderOptions will use selected value
      await loadResults();
    };

    // initial
    loadContexts();
  </script>
</body>
</html>
