<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Voting System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .header {
      width: 100%;
      margin: 20px auto;
    }

    .afpi-hero {
      position: relative;
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background:
        linear-gradient(
          120deg,
          rgba(11, 39, 21, 0.82),
          rgba(24, 97, 58, 0.72),
          rgba(130, 170, 90, 0.30),
          rgba(245, 236, 195, 0.18)
        ),
        url("https://picsum.photos/seed/afpi-musyawarah-2026/1400/500");
      background-size: cover;
      background-position: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .afpi-hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          135deg,
          rgba(8, 30, 18, 0.86),
          rgba(29, 75, 42, 0.50),
          rgba(175, 190, 120, 0.18),
          rgba(255, 255, 255, 0.08)
        );
      z-index: 1;
    }

    .afpi-hero-logo {
      position: absolute;
      top: 22px;
      right: 25px;
      width: 135px;
      max-width: 30%;
      z-index: 2;
      filter: drop-shadow(0 4px 10px rgba(255,255,255,0.32));
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 6px;
    }

    .afpi-hero-title {
      position: absolute;
      left: 35px;
      bottom: 30px;
      z-index: 2;
      color: #b9c97c;
      text-shadow: 0 2px 8px rgba(0,0,0,0.55);
    }

    .afpi-hero-main {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: 1px;
      color: #cddd8a;
    }

    .afpi-hero-year {
      margin-top: 3px;
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 600;
      letter-spacing: 4px;
      color: #dfeab3;
    }

    @media (max-width: 600px) {
      .afpi-hero {
        height: 210px;
      }
      .afpi-hero-logo {
        width: 100px;
        top: 15px;
        right: 15px;
      }
      .afpi-hero-title {
        left: 20px;
        bottom: 20px;
      }
    }

    .subtitle {
      margin: 0;
      font-size: 14px;
      color: #555;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #f6f8fa;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 20px;
    }
    #resultsSection {
      margin-top: 30px;
    }
    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .results-heading h2 {
      margin: 0;
      color: #173b2a;
      font-size: 24px;
    }
    .result-page-title {
      display: none;
    }
    .results-heading p {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 13px;
    }
    #refreshResults {
      width: auto;
      min-width: 132px;
      margin: 0;
      padding: 11px 16px;
      background: #173b2a;
      border: 1px solid #173b2a;
      white-space: nowrap;
    }
    #refreshResults:hover {
      background: #245c40;
    }
    .results-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #resultContextSelect {
      width: auto;
      min-width: 220px;
      margin: 0;
      padding: 11px 36px 11px 12px;
      border-color: rgba(23, 59, 42, 0.24);
      background: rgba(255, 255, 255, 0.82);
    }
    .results-chart-wrap {
      position: relative;
      min-height: 390px;
      padding: 24px;
      border: 1px solid rgba(23, 59, 42, 0.12);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 28px rgba(23, 59, 42, 0.08);
    }
    .results-chart-wrap canvas {
      width: 100% !important;
      height: 340px !important;
      margin-top: 0;
    }
    .result-chart-canvas {
      display: none;
    }
    body:not(.result-mode) .default-result-chart,
    body.result-mode .result-only-chart {
      display: block;
    }
    body:not(.result-mode) .results-heading {
      display: block;
      margin-bottom: 0;
    }
    body:not(.result-mode) .results-heading h2 {
      margin: revert;
      color: revert;
      font-size: revert;
    }
    body:not(.result-mode) .results-heading p {
      display: none;
    }
    body:not(.result-mode) .results-actions {
      display: block;
    }
    body:not(.result-mode) #resultContextSelect {
      display: none;
    }
    body:not(.result-mode) #refreshResults {
      width: 100%;
      min-width: 0;
      margin: 5px 0;
      padding: 10px;
      background: #2563eb;
      border: none;
      white-space: normal;
    }
    body:not(.result-mode) #refreshResults:hover {
      background: #1d4ed8;
    }
    body:not(.result-mode) .results-chart-wrap {
      display: block;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    body:not(.result-mode) .results-chart-wrap canvas {
      width: 100% !important;
      height: 340px !important;
      margin-top: 20px;
    }
    body.result-mode {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(239, 248, 241, 0.9), rgba(248, 250, 247, 0.96)),
        url("https://picsum.photos/seed/afpi-results-2026/1600/900");
      background-size: cover;
      background-attachment: fixed;
    }
    body.result-mode .container {
      max-width: 700px;
      margin: 7vh auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(23, 59, 42, 0.1);
      box-shadow: 0 20px 50px rgba(23, 59, 42, 0.14);
    }
    body.result-mode .results-chart-wrap {
      min-height: 0;
      padding: 0;
    }
    body.result-mode #resultsSection {
      margin-top: 0;
    }
    body.result-mode .normal-result-title {
      display: none;
    }
    body.result-mode .result-page-title {
      display: inline;
    }
    body.result-mode .vote-card img {
      margin: 0;
    }
    #resultMedia {
      display: none;
    }
    body.result-mode #resultMedia {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }
    .result-media-card {
      overflow: hidden;
      border: 1px solid rgba(23, 59, 42, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
    }
    .result-media-card img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      height: auto;
      object-fit: cover;
    }
    .result-media-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
    }
    .result-media-name {
      overflow: hidden;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-media-votes {
      flex: 0 0 auto;
      color: #173b2a;
      font-size: 14px;
      font-weight: 800;
    }
    @media (max-width: 600px) {
      .results-heading {
        align-items: flex-start;
        flex-direction: column;
      }
      #refreshResults {
        width: 100%;
      }
      .results-actions {
        width: 100%;
        flex-direction: column;
      }
      #resultContextSelect {
        width: 100%;
      }
      .results-chart-wrap {
        min-height: 330px;
        padding: 14px;
      }
      .results-chart-wrap canvas {
        height: 290px !important;
      }
      body.result-mode .container {
        margin: 20px auto;
        padding: 18px;
      }
      body.result-mode .results-chart-wrap {
        padding: 0;
      }
    }
    input, button, select, textarea {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #1d4ed8; }
    .section {
      margin-top: 30px;
    }
    .option-input {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .option-input input { flex: 1; }
    canvas { margin-top: 20px; max-width:100%; }
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45); /* semi transparan gelap */
      z-index: 999;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #2563eb;
      font-weight: 500;
      flex-direction: column;
      backdrop-filter: blur(1px); /* efek modern */
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.25);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }
    #loadingOverlayText {
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .vote-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      min-height: 220px;
      border: 2px solid #ddd;
      border-radius: 14px;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
      background: #fff;
      box-sizing: border-box;
    }

    .vote-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 6px 18px rgba(0,0,0,0.12);
    }

    .vote-card.selected {
      transform: translateY(-4px) scale(1.02);
      box-shadow:
        0 0 0 3px rgba(37,99,235,0.12),
        0 8px 20px rgba(0,0,0,0.15);
    }

    #voteOptions {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(190px, 1fr)
      );
      gap: 16px;
      margin-top: 15px;
    }

    .vote-card img {
      width: 100%;
      height: 130px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
      background: #f1f5f9;
    }

    .option-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .vote-option-label {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }

    .vote-card .option-description {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 6px;
    }

    .vote-radio {
      display: none; /* sembunyikan radio asli */
    }

    /* shimmer skeleton */
    .shimmer {
      background: linear-gradient(90deg, #e6e6e6 0%, #f5f5f5 50%, #e6e6e6 100%);
      background-size: 200% 100%;
      border-radius: 10px;
      height: 76px;
      margin: 10px 0;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -150% 0; }
      100% { background-position: 150% 0; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #voterModal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #voterModal .modal-card {
      width: 100%; max-width: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    #voterModal h3 { margin-top:0; color:#1f2937; }
    #voterModal input { margin-bottom:10px; }
    #voterModal .row { display:flex; gap:8px; }
    #voterModal .row button { flex:1; }
  </style>
</head>
<body>
  <!-- single loading overlay -->
  <div id="loadingOverlay" role="status" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
    <div id="loadingOverlayText">Loading...</div>
  </div>

  <div class="header">
    <div class="afpi-hero">
      <div class="afpi-hero-overlay"></div>

      <img
        src="https://afpi.or.id/assets/images/AFPI%20Final%20Logo%20with%20Abbreviation.png"
        alt="AFPI Logo"
        class="afpi-hero-logo"
      />

      <div class="afpi-hero-title">
        <div class="afpi-hero-main">MUSYAWARAH AFPI IV</div>
        <div class="afpi-hero-year">2026</div>
      </div>
    </div>
  </div>
  <!-- VOTER MODAL (hidden until needed) -->
  <div id="voterModal" aria-hidden="true">
    <div class="modal-card">
      <h3>Masukkan Nama & Email</h3>
      <p style="color:#374151; font-size:14px;">Hasil akhir akan dikirimkan ke email Anda.</p>
      <input id="voterName" placeholder="Nama lengkap" type="text" />
      <input id="voterEmail" placeholder="email@domain.com" type="email" />
      <div class="row">
        <button id="voterCancel" type="button">Batal</button>
        <button id="voterSave" type="button" style="background:#2563eb;color:#fff;">Simpan</button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- ADMIN SECTION -->
    <div id="adminSection" class="section" style="display:none;">
      <h2>Create Voting Context</h2>
      <form id="createContextForm">
        <input id="contextTitle" placeholder="Enter vote title..." required />
        <div id="optionsContainer">
          <div class="option-input">
            <input placeholder="Option 1" required />
          </div>
        </div>
        <button type="button" id="addOption">+ Add Option</button>
        <button type="submit">Create Context</button>
      </form>
    </div>

    <!-- VOTER SECTION -->
    <div id="voterSection" class="section">
      <h2>Silakan Tentukan Pilihan Anda!</h2>
      <select id="contextSelect"></select>
      <div id="voteOptions"></div>
      <input id="tokenInput" placeholder="Enter your unique token" />
      <button id="submitVote">Submit Vote</button>
    </div>

    <!-- RESULTS -->
    <div id="resultsSection" class="section">
      <div class="results-heading">
        <div>
          <h2>
            <span class="normal-result-title">Results</span>
            <span class="result-page-title">Voting Results</span>
          </h2>
          <p>Live summary of votes for the selected context</p>
        </div>
        <div class="results-actions">
          <select id="resultContextSelect" aria-label="Select voting context"></select>
          <button id="refreshResults" type="button">Refresh Results</button>
        </div>
      </div>
      <div class="results-chart-wrap">
        <canvas id="defaultResultsChart" class="result-chart-canvas default-result-chart" width="400" height="200"></canvas>
        <canvas id="resultOnlyResultsChart" class="result-chart-canvas result-only-chart" width="400" height="200"></canvas>
      </div>
      <div id="resultMedia"></div>
    </div>
  </div>

  <script>
    //let chart;
    //let pendingVoteId = null;

    // 🔑 WAJIB ADA DI SINI
    const optionColorMap = {};
    const OPTION_COLORS = [
    "#2563eb", // blue
    "#16a34a", // green
    "#dc2626", // red
    "#7c3aed", // purple
    "#ea580c", // orange
    "#0891b2", // cyan
    "#ca8a04", // yellow
    "#be185d"  // pink
    ];

    function getColorByIndex(index) {
      return OPTION_COLORS[index % OPTION_COLORS.length];
    }

    function getOptionTint(color, opacity = 0.05) {
      const red = parseInt(color.slice(1, 3), 16);
      const green = parseInt(color.slice(3, 5), 16);
      const blue = parseInt(color.slice(5, 7), 16);
      return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
    }
    //const API_URL = "https://script.google.com/macros/s/AKfycbx3x9x5CgsZJs2ppyv9ngxKbBpTu6O9ZbEy8LY2Wa7n18B8cj7UzZs-jqYXCoYII7--IA/exec";
    const API_URL = "https://script.google.com/macros/s/AKfycbzkrd9P3DN19fSKfIEWc7vNisqTMDoBT1vYCEdoGbWhseRQGGrdEDqR70O49JeQ7kYEWw/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get("admin") === "1";
    const isResultPage = isAdmin && urlParams.get("result") === "1";

    document.body.classList.toggle("result-mode", isResultPage);
    document.getElementById("adminSection").style.display = isAdmin && !isResultPage ? "block" : "none";
    document.getElementById("voterSection").style.display = isResultPage ? "none" : "block";
    document.querySelector(".header").style.display = isResultPage ? "none" : "block";
    document.getElementById("voterModal").style.display = "none";

    let chart;
    let contexts = [];
    const ctxSelect = document.getElementById("contextSelect");
    const resultContextSelect = document.getElementById("resultContextSelect");
    const voteOptionsDiv = document.getElementById("voteOptions");
    const resultMedia = document.getElementById("resultMedia");
    const chartCanvas = document.getElementById(
      isResultPage ? "resultOnlyResultsChart" : "defaultResultsChart"
    );

    let lastVoteRowSaved = null;
    let pendingVoteId = null;

    function showLoading(show = true, text = "Loading...") {
      const overlay = document.getElementById("loadingOverlay");
      if (!overlay) return;
      overlay.style.display = show ? "flex" : "none";
      document.getElementById("loadingOverlayText").textContent = text;
    }

    async function apiPost(data = {}) {
      const formData = new FormData();
      for (const key in data) {
        formData.append(key, data[key]);
      }

      const res = await fetch(API_URL, {
        method: "POST",
        body: formData,
      });

      return res.json();
    }

    async function apiGet(params = "") {
      const requestUrl = params ? `${API_URL}?${params}` : API_URL;
      let lastError;

      for (let attempt = 0; attempt < 3; attempt += 1) {
        try {
          const res = await fetch(requestUrl, { cache: "no-store" });
          const responseText = await res.text();
          const contentType = res.headers.get("content-type") || "";

          if (res.ok && contentType.includes("application/json")) {
            try {
              return JSON.parse(responseText);
            } catch (error) {
              throw new Error(`API returned invalid JSON: ${responseText.slice(0, 160)}`);
            }
          }

          const preview = responseText.replace(/\s+/g, " ").slice(0, 160);
          lastError = new Error(`API returned ${res.status} ${contentType}: ${preview}`);
        } catch (error) {
          lastError = error;
        }

        if (attempt < 2) {
          await new Promise(resolve => setTimeout(resolve, 400 * (attempt + 1)));
        }
      }

      throw lastError;
    }

    // ---- Load contexts ----
    async function loadContexts() {
      showLoading(true, "Loading contexts...");
      try {
        const json = await apiGet("action=getContexts");
        contexts = json.contexts || [];
        ctxSelect.innerHTML = "";
        resultContextSelect.innerHTML = "";
        if (!json.success || !json.contexts?.length) {
          ctxSelect.innerHTML = `<option value="">No context available</option>`;
          resultContextSelect.innerHTML = `<option value="">No context available</option>`;
          voteOptionsDiv.innerHTML = `<div class="shimmer"></div>`;
          showLoading(false);
          return;
        }
        json.contexts.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.title;
          ctxSelect.appendChild(opt);

          const resultOpt = opt.cloneNode(true);
          resultContextSelect.appendChild(resultOpt);
        });
        // select first by default
        if (ctxSelect.options.length > 0) ctxSelect.selectedIndex = 0;
        resultContextSelect.value = ctxSelect.value;
        // render the first context
        const activeContext = contexts.find(context => context.id === ctxSelect.value);
        await renderOptions(activeContext);
        await loadResults(ctxSelect.value, activeContext);
      } catch (err) {
        console.error("loadContexts error", err);
      } finally {
        showLoading(false);
      }
    }

    // ---- Render options (accept optional ctxArg or use select) ----
    async function renderOptions(ctxArg) {
      showLoading(true, "Loading options...");
      // shimmer
      voteOptionsDiv.innerHTML = `<div class="shimmer"></div><div class="shimmer"></div><div class="shimmer"></div>`;

      try {
        let ctx = ctxArg;
        if (!ctx) {
          // get selected id and fetch contexts
          const selectedId = ctxSelect.value;
          if (!selectedId) {
            voteOptionsDiv.innerHTML = '';
            showLoading(false);
            return;
          }
          ctx = contexts.find(context => context.id === selectedId);
        }

        if (!ctx) {
          voteOptionsDiv.innerHTML = '';
          showLoading(false);
          return;
        }

        // parse options
        let options = ctx.options;
        if (typeof options === "string") {
          try {
            options = JSON.parse(options);
          } catch (e) {
            console.error("Failed to parse options:", e);
            options = [];
          }
        }
        voteOptionsDiv.innerHTML = "";

        options.forEach((opt, idx) => {
          let name = "";
          let img = "";
          let desc = "";

          if (typeof opt === "object" && opt !== null) {
            name = opt.name || opt.title || "Option";
            desc = opt.desc || "";
            if (opt.img) {
              img = opt.img;
            }
          } else {
            name = String(opt);
          }

          const color = getColorByIndex(idx);
          optionColorMap[name] = color;

          if (!img) {
            const imageSeed = encodeURIComponent(
              `afpi-${name.toLowerCase().replace(/\s+/g, "-")}`
            );

            img = `https://picsum.photos/seed/${imageSeed}/500/320`;
          }

          const safeId = String(name).replace(/\s+/g, "_").replace(/[^\w\-]/g, "");
          const div = document.createElement("div");
          div.className = "vote-card";
          div.dataset.defaultBackground = getOptionTint(color);
          div.style.backgroundColor = div.dataset.defaultBackground;

          const optionMarkup = isResultPage
            ? `
              <div class="vote-option-label" style="color:${color}">${escapeHtml(name)}</div>
              <img src="${escapeHtml(img)}" alt="${escapeHtml(name)}" onerror="handleImageError(this)">
              ${desc ? `<div class="option-description">${escapeHtml(desc)}</div>` : ''}
            `
            : `
              <img src="${escapeHtml(img)}" alt="${escapeHtml(name)}" onerror="handleImageError(this)">
              <div class="option-content">
                <div class="vote-option-label" style="color:${color}">${escapeHtml(name)}</div>
                ${desc ? `<div class="option-description">${escapeHtml(desc)}</div>` : ''}
              </div>
            `;

          div.innerHTML = `
            <input type="radio" class="vote-radio" id="opt_${safeId}" name="voteOption" value="${escapeHtml(name)}" data-color="${color}">
            ${optionMarkup}
          `;

          // click selects radio and highlights card
          div.onclick = () => {
            const el = document.getElementById(`opt_${safeId}`);
            if (el) el.checked = true;
            document.querySelectorAll(".vote-card").forEach(c => {
              c.classList.remove("selected");
              c.style.borderColor = "#ddd";
              c.style.backgroundColor = c.dataset.defaultBackground;
            });
            div.classList.add("selected");
            div.style.borderColor = color;
            div.style.backgroundColor = getOptionTint(color, 0.14);
          };
          voteOptionsDiv.appendChild(div);
        });

      } catch (err) {
        console.error("renderOptions error", err);
        voteOptionsDiv.innerHTML = `<div class="shimmer"></div>`;
      } finally {
        showLoading(false);
      }
    }

    // simple HTML escaping to avoid broken attributes
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function handleImageError(imageElement) {
      imageElement.onerror = null;
      const label = imageElement.alt || "Option";
      imageElement.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="500" height="700" viewBox="0 0 500 700">
          <rect width="500" height="700" fill="#e2e8f0"/>
          <text x="250" y="350" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="24">${label}</text>
        </svg>
      `)}`;
    }

    // ---- Create context (Admin only) ----
    if (isAdmin) {
      document.getElementById("addOption").onclick = () => {
        const div = document.createElement("div");
        div.classList.add("option-input");
        div.innerHTML = `<input placeholder="New Option" required />`;
        document.getElementById("optionsContainer").appendChild(div);
      };

      document.getElementById("createContextForm").onsubmit = async (e) => {
        e.preventDefault();
        const title = document.getElementById("contextTitle").value.trim();
        const options = Array.from(document.querySelectorAll("#optionsContainer input"))
          .map(i => i.value.trim()).filter(Boolean);
        showLoading(true, "Creating context...");
        try {
          const res = await apiPost({ action: "createContext", title, options: JSON.stringify(options) });
          alert(res.message || "Context created!");
          await loadContexts();
        } catch (err) {
          console.error("create context error", err);
          alert("Failed to create context");
        } finally {
          showLoading(false);
        }
      };
    }

    //let pendingVoteRow = null; // will hold numeric row returned from submitVote

// Helper: submit vote to backend and return response
    async function submitVoteToBackend(contextId, choice, token, fingerprint) {
      return await apiPost({
        action: "submitVote",
        contextId,
        choice,
        token,
        fingerprint
      });
    }

    // Helper: delete vote row
    async function deleteVoteById(voteId) {
      return await apiPost({ action: "deleteVote", voteId });
    }

    // Helper: save voter info
    async function saveVoterInfoRow(voteId, voterString) {
      return await apiPost({ action: "saveVoterInfo", voteId: String(voteId), voter: voterString });
    } 
    
    // ---- Submit vote ----
    // CLICK: Submit Vote
    document.getElementById("submitVote").addEventListener("click", async () => {
      const selectedEl = document.querySelector("input[name='voteOption']:checked");
      const token = document.getElementById("tokenInput").value.trim();
      const contextId = ctxSelect.value;

      if (!selectedEl) { alert("Please select a vote option."); return; }
      if (!token) { alert("Token is required."); return; }
      if (!contextId) { alert("Context not selected"); return; }

      const choice = selectedEl.value;
      const fingerprint = navigator.userAgent || "";

      showLoading(true, "Submitting vote...");

      // 1) submit vote to backend -> backend should append row and return row number
      let res;
      try {
        //res = await submitVoteToBackend(contextId, choice, token, fingerprint);
        res = await submitVoteToBackend(contextId, choice, token, fingerprint);
        console.log("RAW submitVote response:", JSON.stringify(res));
      } catch (err) {
        showLoading(false);
        console.error("Network error submitVote:", err);
        alert("Network error when submitting vote.");
        return;
      }

      showLoading(false);

      if (!res || !res.success) {
        console.warn("submitVote result:", res);
        alert(res?.message || "Failed to submit vote.");
        return;
      }

      // Save numeric voteId  for fallback & later saveVoterInfo
      function isUUIDv4(str) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(str);
      }

      pendingVoteId = res.voteId;

      if (!pendingVoteId || typeof pendingVoteId !== "string") {
        console.error("Invalid voteId returned from backend", res);
        alert("Server error: invalid voteId returned Bos.");
        return;
      }

      // 2) Show modal and wait for user action (save or cancel)
      openVoterModal();
    });

// ---- Modal Logic ----
    // Modal: Cancel -> delete pending vote
    document.getElementById("voterCancel").addEventListener("click", async () => {
      // If there's a pending vote row, delete it
      if (!pendingVoteId) {
        closeVoterModal();
        return;
      }
      showLoading(true, "Cancelling vote...");
      try {
          const del = await deleteVoteById(pendingVoteId);
          console.log("deleteVote result:", del);
          console.log("deleteVote result:", del.success);
          if (!del || del.success !== true) {
            console.warn("deleteVote failed:", del);
            alert("Gagal menghapus vote. Silakan refresh halaman.");
          }
          // success
          pendingVoteId = null;
          closeVoterModal();
          alert("Vote dibatalkan karena identitas tidak diisi.");
          await loadResults();
      } catch (err) {
          console.error("deleteVote network error:", err);
          alert("Network error while cancelling vote.");
      } finally {
        showLoading(false);
      }
    });
    // Modal: Save -> save voter info
    document.getElementById("voterSave").addEventListener("click", async () => {
      const name = document.getElementById("voterName").value.trim();
      const email = document.getElementById("voterEmail").value.trim();
      if (!name || !email) { alert("Nama & email wajib diisi."); return; }
      if (!pendingVoteId) { alert("Tidak ada vote tertunda untuk disimpan."); return; }

      const voterString = `${name}-${email}`;

      showLoading(true, "Saving identity...");
      try {
        const res = await saveVoterInfoRow(pendingVoteId, voterString);
        if (!res || !res.success) {
          console.warn("saveVoterInfo failed:", res);
          alert(res?.message || "Gagal menyimpan identitas.");
          return;
        }
        // success
        alert("Vote & Identitas tersimpan. Terima kasih!");
        // close modal and clear state
        pendingVoteId = null;
        closeVoterModal();
        // optionally persist name/email for future (if you want)
        // localStorage.setItem("voter_name", name); localStorage.setItem("voter_email", email);
        await loadResults();
      } catch (err) {
        console.error("saveVoterInfo network error:", err);
        alert("Network error while saving identity.");
      } finally {
        showLoading(false);
      }
    });

    // Modal control
    function openVoterModal(){
      document.getElementById("voterModal").style.display = "flex";
      document.getElementById("voterName").focus();
    }
    function closeVoterModal(){
      document.getElementById("voterModal").style.display = "none";
      document.getElementById("voterName").value = "";
      document.getElementById("voterEmail").value = "";
    }

    // ensure lastVoteRowSaved reset on context change or reload to avoid stale values
    ctxSelect.onchange = async () => {
      lastVoteRowSaved = null;
      Object.keys(optionColorMap).forEach(k => delete optionColorMap[k]);
      resultContextSelect.value = ctxSelect.value;
      await renderOptions();
      await loadResults();
    };

    resultContextSelect.onchange = async () => {
      const selectedContextId = resultContextSelect.value;
      ctxSelect.value = selectedContextId;
      lastVoteRowSaved = null;
      Object.keys(optionColorMap).forEach(k => delete optionColorMap[k]);
      const activeContext = contexts.find(context => context.id === selectedContextId);
      await renderOptions(activeContext);
      await loadResults(selectedContextId, activeContext);
    };
    // ---- Load results ----
    async function loadResults(
      contextId = isResultPage ? resultContextSelect.value : ctxSelect.value,
      activeContext = contexts.find(context => context.id === contextId)
    ) {
      if (!contextId) return;
      showLoading(true, "Loading results...");
      if (!Object.keys(optionColorMap).length) {
        await renderOptions(activeContext);
      }
      try {
        const json = await apiGet(`action=getResults&contextId=${contextId}`);
        if (!json.success) {
          console.warn("Error getResults", json);
          showLoading(false);
          return;
        }

        //const labels = Object.keys(json.results);
        //const data = Object.values(json.results);
        //const backgroundColors = labels.map((_, idx) => getColorByIndex(idx));
        const labels = [];
        const data = [];
        const backgroundColors = [];

        Object.keys(optionColorMap).forEach(option => {
          labels.push(option);
          data.push(json.results[option] || 0);
          backgroundColors.push(optionColorMap[option]);
        });
        renderResultMedia(activeContext, json.results || {});
        if (chart) chart.destroy();
        chart = new Chart(chartCanvas, {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "Votes",
              data,
              backgroundColor: backgroundColors,
              borderRadius: {
                topLeft: 8,
                topRight: 8,
                bottomLeft: 0,
                bottomRight: 0
              },
              borderSkipped: false,
              ...(isResultPage ? { maxBarThickness: 64 } : {})
            }]
          },
          options: isResultPage ? {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 650,
              easing: "easeOutQuart"
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: "#475569" }
              },
              y: {
                beginAtZero: true,
                ticks: { precision: 0, color: "#64748b" },
                grid: { color: "rgba(100, 116, 139, 0.14)" }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                displayColors: false,
                callbacks: {
                  label: context => ` ${context.parsed.y} vote`
                }
              }
            }
          } : {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true }
            },
            plugins: {
              legend: { display: false }
            }
          }
        });

      } catch (err) {
        console.error("loadResults error", err);
      } finally {
        showLoading(false);
      }
    }

    function renderResultMedia(context, results) {
      if (!isResultPage || !context || !resultMedia) return;

      let options = context.options;
      if (typeof options === "string") {
        try {
          options = JSON.parse(options);
        } catch (error) {
          options = [];
        }
      }

      resultMedia.innerHTML = (options || []).map(option => {
        const name = typeof option === "object" && option !== null
          ? option.name || option.title || "Option"
          : String(option);
        const imageSeed = encodeURIComponent(
          `afpi-${name.toLowerCase().replace(/\s+/g, "-")}`
        );
        const image = typeof option === "object" && option !== null && option.img
          ? option.img
          : `https://picsum.photos/seed/${imageSeed}/500/700`;
        const count = results[name] || 0;

        return `
          <div class="result-media-card">
            <img src="${escapeHtml(image)}" alt="${escapeHtml(name)}" onerror="handleImageError(this)">
            <div class="result-media-info">
              <span class="result-media-name">${escapeHtml(name)}</span>
              <span class="result-media-votes">${count}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    document.getElementById("refreshResults").onclick = loadResults;
    // initial
    loadContexts();
  </script>
</body>
</html>
